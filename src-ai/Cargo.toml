[package]
name = "wealthvn_ai"
version = "0.1.0"
edition = "2021"
description = "AI assistant with LLM orchestration using rig-core for WealthVN"
authors = ["chipheo00"]
license = "AGPL-3.0"
repository = "https://github.com/chipheo00/wealth-vn"

[features]
default = []

[dependencies]
# Core dependencies
tokio = { version = "1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1.0", features = ["v4", "v7"] }
async-trait = "0.1"
futures = "0.3"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }

# LLM orchestration (rig-core crate exports as "rig")
rig = { package = "rig-core", version = "0.30" }

# Lazy static initialization
once_cell = "1"

# CSV parsing
csv = "1.3"

# Streaming
tokio-stream = "0.1"

# Numbers (for Decimal to f64 conversion)
rust_decimal = "1"

# Keyring for secure secret storage
keyring = "3"

# Sibling crates
wealthvn_core = { path = "../src-core" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
