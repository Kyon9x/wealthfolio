[package]
name = "wealthvn-server"
version = "1.0.6"
description = "WealthVN web server"
authors = ["chipheo00"]
license = "AGPL-3.0"
repository = "https://github.com/chipheo00/wealth-vn"
edition = "2021"

[dependencies]
# Internal crates
wealthvn_core = { path = "../src-core" }
wealthvn_ai = { path = "../src-ai" }

# Web framework
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "timeout"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
diesel = { version = "2.2", features = ["sqlite", "chrono", "r2d2", "numeric", "returning_clauses_for_sqlite_3_35"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
log = "0.4"

# Configuration
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Utils
base64 = "0.22"

[lib]
name = "wealthvn_server_lib"
crate-type = ["rlib"]

[[bin]]
name = "wealthvn-server"
path = "src/main.rs"
